<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MESSAGE CHECKER</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 {
            margin-bottom: 1.5rem;
            color: #0f172a;
            font-size: 1.75rem;
        }
        .warning-msg {
            font-weight: 600;
            margin-bottom: 1rem;
            padding: 0.75rem;
            border-radius: 0.375rem;
            background-color: #eff6ff;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.375rem;
            resize: none;
            font-size: 1rem;
            margin-bottom: 1.25rem;
            box-sizing: border-box;
        }
        textarea:focus {
            outline: 2px solid #2563eb;
            border-color: transparent;
        }
        button {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Dynamic backend verification response message -->
        {% if warning %}
            <p class="warning-msg" style="color: rgb(255, 0, 0);">{{ warning }}</p>
        {% endif %}

        <h1>MESSAGE CHECKER</h1>

        <!-- Form submission routing -->
        <form action="/" method="POST">
            <textarea 
                name="message" 
                placeholder="Paste your message here..." 
                required></textarea>
            <button type="submit">Check Message</button>
        </form>
    </div>

</body>
</html>
